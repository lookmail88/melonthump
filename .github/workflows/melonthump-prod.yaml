name: Build Push and Auto Release to GHCR (Prod)

on:
  push:
    branches: [ "main" ]
    paths: [ 'server/**', 'ios/MelonThump.xcodeproj/**' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  build-and-push:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # No semantic-release on main: version bumps happen only on
      # development. This workflow just reads the latest release tag
      # (created by the dev workflow) and builds/deploys that version.
      - name: Get release version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build with Maven
        working-directory: server
        run: mvn -q clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get iOS app version
        id: appversion
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION =' ios/MelonThump.xcodeproj/project.pbxproj | sed 's/.*= *//; s/;//; s/ *$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "iOS app version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: |
            CLIENT_LATEST_VERSION=${{ steps.appversion.outputs.APP_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
