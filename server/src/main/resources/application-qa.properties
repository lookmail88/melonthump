# QA profile: standalone boot on an in-memory H2 database (PostgreSQL
# compatibility mode). The schema is built by the same Flyway migrations
# as production (they are written to run on both). Requires the H2 driver
# on the runtime classpath, which only the `qa` Maven profile provides —
# see QA-RUN.md. Data lives only for the life of the process.
spring.datasource.url=jdbc:h2:mem:melonthump-qa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Admin API on (there is no Cloudflare Access in front of a local QA boot).
melonthump.admin.enabled=true
# Dev-flavoured attest settings so QA can drive the existing attested
# endpoints with the simulator bypass header (X-Attest-Bypass: simulator).
melonthump.attest.accept-develop=true
melonthump.attest.debug-bypass-enabled=true
# Stats summary admin token for QA (header X-Admin-Token).
melonthump.stats.admin-token=qa-admin-token
logging.level.dev.melonthump=DEBUG
