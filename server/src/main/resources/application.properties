server.port=8080
spring.application.name=melonthump-server

# Uploads: tap recordings are short; 10 MB is plenty.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Client version policy (forced-update gate). latest-version is stamped
# by CI from the iOS app's MARKETING_VERSION at image build time (Docker
# ENV); the literal here is only the local-dev fallback. min-supported
# stays manual — it is the hard floor below which clients must update.
melonthump.client.platform=ios
melonthump.client.latest-version=${MELONTHUMP_CLIENT_LATEST_VERSION:1.0.0}
melonthump.client.min-supported-version=1.0.0
melonthump.client.update-url=
# Credits granted for one completed rewarded ad. -1 declares a free
# day: clients use the app without limits for the rest of that day and
# no ads are shown. Flip it here (and redeploy) to run a free day.
melonthump.client.credit-per-ad=1
# Launch promo window: epoch milliseconds at which the promo ends
# (empty = no promo running). During the promo, the first app open of
# each day requires one completed rewarded ad, which unlocks unlimited
# use for the rest of that day; credits are neither needed nor spent.
# Set via env MELONTHUMP_PROMO_ENDS_AT_EPOCH_MILLIS.
melonthump.client.promo-ends-at-epoch-millis=${MELONTHUMP_PROMO_ENDS_AT_EPOCH_MILLIS:}
