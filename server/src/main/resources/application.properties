server.port=8080
spring.application.name=melonthump-server

# Multipart uploads. Only the 2.0 sample endpoints accept multipart
# (/api/v1/contributions/samples): per-file limits are enforced in code
# (photo <= 10 MB, recording <= 25 MB -> 413); these container limits
# are the outer bound (largest single file, whole request). Note the
# Cloudflare edge caps request bodies at 100 MB.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
# A sample request has at most meta + 12 appearance + recording + cutOpen parts.
server.tomcat.max-part-count=32

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Client version policy (forced-update gate). latest-version is stamped
# by CI from the iOS app's MARKETING_VERSION at image build time (Docker
# ENV); the literal here is only the local-dev fallback. min-supported
# stays manual — it is the hard floor below which clients must update.
melonthump.client.platform=ios
melonthump.client.latest-version=${MELONTHUMP_CLIENT_LATEST_VERSION:1.0.0}
melonthump.client.min-supported-version=1.0.0
melonthump.client.update-url=https://apps.apple.com/us/app/melonthump/id6825623861
# Credits granted for one completed rewarded ad. -1 declares a free
# day: clients use the app without limits for the rest of that day and
# no ads are shown. Flip it here (and redeploy) to run a free day.
melonthump.client.credit-per-ad=1
# Launch promo window: epoch milliseconds at which the promo ends
# (empty = no promo running). During the promo, the first thump after
# each fresh app launch requires one completed rewarded ad, which
# unlocks unlimited use until the app exits; credits are neither
# needed nor spent. Set via env MELONTHUMP_PROMO_ENDS_AT_EPOCH_MILLIS.
melonthump.client.promo-ends-at-epoch-millis=${MELONTHUMP_PROMO_ENDS_AT_EPOCH_MILLIS:}

# --- 1.2.0: post-promotion allowance policy (design doc 1.2.0 §3) ---
# Server-tunable, no app recompile. Sent ONLY to clients reporting
# currentVersion >= 1.2.0; older clients get the 1.1.0 response
# byte for byte. Defaults are the design values; a malformed or
# out-of-range value falls back to the default.
# Initial free thumps per user (first analysis free + a one-time grant
# of N-1 credits). Env: MELONTHUMP_INITIAL_FREE_THUMPS (>= 0).
melonthump.client.initial-free-thumps=${MELONTHUMP_INITIAL_FREE_THUMPS:2}
# Session-unlock gate after the free thumps: true = one rewarded ad (or
# the ad-free credit price) unlocks unlimited thumps until the app exits;
# false = no gate, unlimited use, no ads. Env: MELONTHUMP_SESSION_UNLOCK_ENABLED.
melonthump.client.session-unlock-enabled=${MELONTHUMP_SESSION_UNLOCK_ENABLED:true}
# Credits spent to unlock one session without an ad (>= 1).
# Env: MELONTHUMP_AD_FREE_SESSION_CREDIT_PRICE.
melonthump.client.ad-free-session-credit-price=${MELONTHUMP_AD_FREE_SESSION_CREDIT_PRICE:1}
# Server-selector gate (1.2.0 §2): the client version currently in
# TestFlight and the one released on the App Store. Empty = field
# omitted (the selector then stays hidden). Env:
# MELONTHUMP_TESTFLIGHT_VERSION / MELONTHUMP_PRODUCT_VERSION.
melonthump.client.testflight-version=${MELONTHUMP_TESTFLIGHT_VERSION:}
melonthump.client.product-version=${MELONTHUMP_PRODUCT_VERSION:}

# --- 1.1.0: usage stats + App Attest (design doc: docs/1.1.0-通信设计.md) ---
# Datasource comes from the melonthump-db k8s Secret via SPRING_DATASOURCE_*
# env (relaxed binding); there is deliberately no URL/credential here.
spring.flyway.enabled=true

# Rewarded ad unit ID handed ONLY to attested clients on the version
# policy response. Empty = field omitted (dev keeps Google test units,
# per the design). Set via env MELONTHUMP_REWARDED_AD_UNIT_ID (prod only).
melonthump.client.rewarded-ad-unit-id=${MELONTHUMP_REWARDED_AD_UNIT_ID:}

# App Attest. app-id is <TeamID>.<bundleID>; the team/bundle pair is
# already public in the iOS project file.
melonthump.attest.app-id=${MELONTHUMP_ATTEST_APP_ID:TM68JW5KDR.dev.xuyang.melonthump}
# Dev backend also accepts develop-environment attestations (Xcode
# installs); prod must leave this false. Env: MELONTHUMP_ATTEST_ACCEPT_DEVELOP.
melonthump.attest.accept-develop=${MELONTHUMP_ATTEST_ACCEPT_DEVELOP:false}
# Simulator debug bypass (header X-Attest-Bypass: simulator) — honoured
# ONLY when this is true, and it is set true solely in the dev manifest.
melonthump.attest.debug-bypass-enabled=${MELONTHUMP_ATTEST_DEBUG_BYPASS:false}
melonthump.attest.challenge-ttl-seconds=300
melonthump.attest.root-ca-location=classpath:apple/Apple_App_Attestation_Root_CA.pem

# Logging: RequestLoggingFilter writes one DEBUG line per request.
# The app-package level comes from MELONTHUMP_LOG_LEVEL, set in the
# k8s manifests: DEBUG on dev (request lines visible), ERROR on prod
# (only errors print). Local fallback is INFO.
logging.level.dev.melonthump=${MELONTHUMP_LOG_LEVEL:INFO}

# Admin token for GET /api/v1/stats/summary (header X-Admin-Token).
# Empty = summary endpoint always refuses. Env: MELONTHUMP_STATS_ADMIN_TOKEN.
melonthump.stats.admin-token=${MELONTHUMP_STATS_ADMIN_TOKEN:}

# --- 1.2.0: invites (design doc 1.2.0 §3) ---
# Credits granted to each side (inviter and invitee) of a confirmed
# invite, and the per-inviter cap on rewarded invites. The credit ledger
# stays on-device; the server only confirms and tracks claims.
melonthump.invite.reward-credits=${MELONTHUMP_INVITE_REWARD_CREDITS:5}
melonthump.invite.cap=${MELONTHUMP_INVITE_CAP:10}

# --- 2.0: contributor data layer + admin API (design doc 2.0 §2 items 6-8) ---
# JPA entities over the Flyway-owned schema: Hibernate never touches DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Owner admin REST API (/api/admin/**). The app does not authenticate it:
# in production Cloudflare Access guards the prefix at the edge. Keep this
# false on any host until its Access policy covers /api/admin/**; while
# false every /api/admin path is a 404. Env: MELONTHUMP_ADMIN_ENABLED.
melonthump.admin.enabled=${MELONTHUMP_ADMIN_ENABLED:false}

# --- 2.0 S2: contributed material files (design doc 2.0 §5 item 6, §7 item 8) ---
# Server-local root for contributed photos / recordings, laid out as
# <contributorId>/<sampleId>/<part>-<n>.<ext>. Relative paths resolve
# against the working directory. No public endpoint serves these files.
# Env: MELONTHUMP_CONTRIB_STORAGE_DIR.
melonthump.contrib.storage-dir=${MELONTHUMP_CONTRIB_STORAGE_DIR:contrib-materials}

# --- 2.0 S3: incentive ledger (design doc 2.0 §7 item 9) ---
# Ad-free units granted when the owner approves a COMPLETE sample (one
# unit waives one rewarded ad to unlock a session). Incomplete samples
# earn nothing; voiding claws back unused units (floored at zero).
# Env: MELONTHUMP_CONTRIB_ADFREE_PER_APPROVED_SAMPLE (>= 0).
melonthump.contrib.adfree-per-approved-sample=${MELONTHUMP_CONTRIB_ADFREE_PER_APPROVED_SAMPLE:5}

# --- 2.0 S4: runtime admin settings + admin page (design doc 2.0 §7 items 9-11) ---
# The four operational ad switches (adfree_per_approved_sample,
# promo_ends_at_epoch_millis, initial_free_thumps, credit_per_ad) can be
# overridden at runtime from the admin page (table admin_settings, V7);
# the properties above stay the defaults. Consumers re-read the overrides
# at most this often (a local write is visible immediately; other
# replicas see it within this window).
melonthump.admin.settings-cache-millis=5000
# The admin web page is static (classpath:/static/admin/) and served at
# /admin/ regardless of melonthump.admin.enabled; it holds no data. In
# production put /admin/ behind the same Cloudflare Access policy as
# /api/admin/**. Admin audit rows record the Access identity from the
# Cf-Access-Authenticated-User-Email header (fallback: "owner").
