server.port=8080
spring.application.name=melonthump-server

# Uploads: tap recordings are short; 10 MB is plenty.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Client version policy (forced-update gate; bump on release)
melonthump.client.platform=ios
melonthump.client.latest-version=1.0.0
melonthump.client.min-supported-version=1.0.0
melonthump.client.update-url=
