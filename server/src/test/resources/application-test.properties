# Tests: real Flyway migration + repositories against in-memory H2
# running in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:melonthump-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Dev-flavoured attest settings so the synthetic-chain tests can enroll
# develop-environment keys and use the simulator bypass.
melonthump.attest.accept-develop=true
melonthump.attest.debug-bypass-enabled=true
melonthump.stats.admin-token=test-admin-token
# Placeholder only — proves the attested-only field plumbing; not a real ID.
melonthump.client.rewarded-ad-unit-id=test-placeholder-unit-id
