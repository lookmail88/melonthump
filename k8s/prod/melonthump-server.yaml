apiVersion: v1
kind: Namespace
metadata:
  name: melonthump-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: melonthump-server
  namespace: melonthump-prod
  labels:
    app: melonthump-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: melonthump-server
  template:
    metadata:
      labels:
        app: melonthump-server
    spec:
      containers:
        - name: server
          image: ghcr.io/lookmail88/melonthump-server:v1.8.1
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: melonthump-db
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: melonthump-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: melonthump-db
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: melonthump-server
  namespace: melonthump-prod
  labels:
    app: melonthump-server
spec:
  selector:
    app: melonthump-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
