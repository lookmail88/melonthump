apiVersion: v1
kind: Namespace
metadata:
  name: melonthump-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: melonthump-server
  namespace: melonthump-dev
  labels:
    app: melonthump-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: melonthump-server
  template:
    metadata:
      labels:
        app: melonthump-server
    spec:
      containers:
        - name: server
          image: ghcr.io/lookmail88/melonthump-server:v1.11.4
          imagePullPolicy: Always
          env:
            # 1.1.0 App Attest (design doc §5/§7): the dev backend also
            # accepts develop-environment attestations (Xcode installs)
            # and the simulator debug bypass. Prod sets NEITHER — its
            # defaults stay production-only with no bypass.
            - name: MELONTHUMP_ATTEST_ACCEPT_DEVELOP
              value: "true"
            - name: MELONTHUMP_ATTEST_DEBUG_BYPASS
              value: "true"
            # Dev runs the app log at DEBUG so every client request
            # prints one line (RequestLoggingFilter). Prod uses ERROR.
            - name: MELONTHUMP_LOG_LEVEL
              value: "DEBUG"
            # Launch promo on the test build: window runs until the end
            # of 2026 — 2027-01-01 00:00 America/Los_Angeles (epoch ms).
            - name: MELONTHUMP_PROMO_ENDS_AT_EPOCH_MILLIS
              value: "1798790400000"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: melonthump-db
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: melonthump-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: melonthump-db
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: melonthump-server
  namespace: melonthump-dev
  labels:
    app: melonthump-server
spec:
  selector:
    app: melonthump-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
